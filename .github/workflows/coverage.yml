name: Coverage

on:
  # push は既定ブランチ(develop)のみ。Codecov の比較ベースラインを更新するために必要。
  # main への push は develop で検証済みの同一ツリーなので落とす。
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter webapp prisma generate

      - name: Unit テスト + カバレッジ計測
        run: pnpm test:coverage

      - name: Codecov へアップロード
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/webapp/coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
